<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HYSSOP | Admin Login</title>
  <link rel="icon" href="https://i.postimg.cc/dtp1VnDR/Gemini-Generated-Image-q4zen2q4zen2q4ze.jpg" type="image/jpeg" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <style>
    /* ── RESET & BASE ── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      position: relative;
      background: #0a0d0b;
    }

    /* ── FULL‑SCREEN BACKGROUND ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -2;
      background: url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=1600&q=80') center center / cover no-repeat fixed;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background: rgba(8, 11, 9, 0.55);
      backdrop-filter: blur(4px);
    }

    /* ── LOGIN CARD ── */
    .login-card {
      width: 100%;
      max-width: 460px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 40px;
      padding: 48px 40px 40px;
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      animation: slideUp 0.8s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
      transition: box-shadow 0.4s ease;
    }
    .login-card:hover {
      box-shadow: 0 60px 140px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    /* subtle animated gold glow */
    .login-card::before {
      content: '';
      position: absolute;
      top: -40%;
      right: -20%;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(215, 173, 69, 0.08), transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: glowPulse 6s ease-in-out infinite alternate;
    }
    .login-card::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -20%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(215, 173, 69, 0.04), transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: glowPulse 8s ease-in-out infinite alternate-reverse;
    }
    @keyframes glowPulse {
      0% { transform: translate(0, 0) scale(1); opacity: 0.6; }
      100% { transform: translate(40px, 20px) scale(1.2); opacity: 1; }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── BRAND ── */
    .brand {
      text-align: center;
      margin-bottom: 32px;
      position: relative;
      z-index: 1;
    }
    .brand .logo-icon {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 2px solid rgba(215, 173, 69, 0.4);
      box-shadow: 0 0 50px rgba(215, 173, 69, 0.06);
      object-fit: cover;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      margin-bottom: 12px;
    }
    .brand .logo-icon:hover {
      transform: scale(1.06) rotate(3deg);
    }
    .brand h1 {
      font-family: Georgia, serif;
      font-size: 34px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 30px rgba(0, 0, 0, 0.2);
    }
    .brand h1 span {
      color: #d7ad45;
    }
    .brand .subtitle {
      color: #8a8f8c;
      font-size: 14px;
      margin-top: 2px;
      letter-spacing: 0.3px;
    }

    /* ── TYPEWRITER ── */
    .tagline-wrapper {
      text-align: center;
      margin-bottom: 30px;
      min-height: 30px;
      position: relative;
      z-index: 1;
    }
    .tagline-wrapper .tagline {
      color: #d7ad45;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.3px;
      opacity: 0.9;
    }
    .tagline-wrapper .tagline .typewriter {
      display: inline-block;
      border-right: 2.5px solid #d7ad45;
      padding-right: 6px;
      animation: blink 0.8s step-end infinite;
    }
    @keyframes blink {
      50% { border-color: transparent; }
    }

    /* ── FORM ── */
    .form-group {
      margin-bottom: 22px;
      position: relative;
      z-index: 1;
    }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #b0b5b2;
      margin-bottom: 6px;
      transition: color 0.3s;
    }
    .form-group .input-wrap {
      position: relative;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
    }
    .form-group .input-wrap:focus-within {
      border-color: #d7ad45;
      box-shadow: 0 0 0 4px rgba(215, 173, 69, 0.08);
      background: rgba(0, 0, 0, 0.35);
    }
    .form-group .input-wrap .icon-left {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #666;
      font-size: 16px;
      transition: color 0.3s;
      pointer-events: none;
    }
    .form-group .input-wrap:focus-within .icon-left {
      color: #d7ad45;
    }
    .form-group input {
      width: 100%;
      padding: 14px 50px 14px 48px;
      border: none;
      background: transparent;
      color: #fff;
      font-size: 15px;
      outline: none;
      font-weight: 400;
    }
    .form-group input::placeholder {
      color: #666;
      font-weight: 300;
    }
    /* Password toggle (right side) */
    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 18px;
      padding: 6px;
      transition: color 0.3s, transform 0.2s;
      z-index: 2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
    }
    .password-toggle:hover {
      color: #d7ad45;
      background: rgba(215, 173, 69, 0.06);
    }
    .password-toggle:active {
      transform: translateY(-50%) scale(0.92);
    }

    /* ── BUTTON ── */
    .btn-login {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #d7ad45, #e8c25a);
      color: #111;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 8px;
      position: relative;
      z-index: 1;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 20px rgba(215, 173, 69, 0.15);
    }
    .btn-login:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(215, 173, 69, 0.25);
    }
    .btn-login:active {
      transform: translateY(0);
      box-shadow: 0 4px 15px rgba(215, 173, 69, 0.15);
    }
    .btn-login i {
      margin-right: 6px;
    }

    /* ── ERROR ── */
    .error-message {
      color: #e74c3c;
      font-size: 13px;
      margin-top: 14px;
      text-align: center;
      display: none;
      position: relative;
      z-index: 1;
      padding: 8px 12px;
      background: rgba(231, 76, 60, 0.08);
      border-radius: 30px;
      border: 1px solid rgba(231, 76, 60, 0.12);
    }
    .error-message.show {
      display: block;
      animation: shake 0.4s ease;
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    /* ── DIVIDER ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0 12px;
      position: relative;
      z-index: 1;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.06);
    }
    .divider span {
      color: #555;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
    }

    /* ── FOOTER ── */
    .footer-links {
      margin-top: 16px;
      text-align: center;
      color: #666;
      font-size: 12px;
      position: relative;
      z-index: 1;
    }
    .footer-links strong {
      color: #d7ad45;
      font-weight: 600;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #888;
      font-size: 13px;
      text-decoration: none;
      transition: all 0.3s ease;
      margin-top: 14px;
      padding: 6px 14px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .back-link:hover {
      color: #d7ad45;
      border-color: rgba(215, 173, 69, 0.2);
      background: rgba(215, 173, 69, 0.05);
      transform: translateX(-4px);
    }
    .back-link i {
      font-size: 14px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .login-card {
        padding: 32px 24px 28px;
        border-radius: 30px;
      }
      .brand .logo-icon {
        width: 72px;
        height: 72px;
      }
      .brand h1 {
        font-size: 28px;
      }
      .tagline-wrapper .tagline {
        font-size: 14px;
      }
      .form-group input {
        font-size: 14px;
        padding: 12px 46px 12px 42px;
      }
      .password-toggle {
        right: 10px;
        width: 32px;
        height: 32px;
        font-size: 16px;
      }
      .btn-login {
        font-size: 15px;
        padding: 14px;
      }
    }
  </style>
</head>
<body>

  <div class="login-card">

    <!-- ── BRAND ── -->
    <div class="brand">
      <img class="logo-icon" src="https://i.postimg.cc/dtp1VnDR/Gemini-Generated-Image-q4zen2q4zen2q4ze.jpg" alt="Hyssop Choir" />
      <h1>HYSSOP CHOIR <span>ADMIN ACCESS</span></h1>
      <p class="subtitle">Manage news & updates</p>
    </div>

    <!-- ── TYPEWRITER ── -->
    <div class="tagline-wrapper">
      <div class="tagline">
        <span id="typewriterText" class="typewriter"></span>
      </div>
    </div>

    <!-- ── LOGIN FORM ── -->
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrap">
          <input type="text" id="username" placeholder="Enter your username" required autofocus />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Enter your password" required />
          <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">
            <i class="fa-regular fa-eye" id="toggleIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login">
         Sign In
      </button>

      <div class="error-message" id="loginError">Invalid username or password.</div>
    </form>

    <!-- ── DIVIDER ── -->
    <div class="divider">
      <span>Secure Access</span>
    </div>

    <!-- ── FOOTER ── -->
    <div class="footer-links">
      <a href="/" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Back to Website
      </a>
    </div>

  </div>

  <script>
    // ── Typewriter Effect ──
    (function typeWriter() {
      const texts = [
        'Worship that inspires faith.',
        'Gospel that transforms lives.',
        'Music that heals souls.',
        'Praise that lifts hearts.',
        'Sharing the message of Christ.'
      ];
      let index = 0;
      const el = document.getElementById('typewriterText');
      let charIndex = 0;
      let isDeleting = false;
      let currentText = '';

      function type() {
        const fullText = texts[index];
        if (isDeleting) {
          currentText = fullText.substring(0, charIndex--);
          el.textContent = currentText;
          if (charIndex < 0) {
            isDeleting = false;
            index = (index + 1) % texts.length;
            setTimeout(type, 800);
            return;
          }
          setTimeout(type, 40);
        } else {
          currentText = fullText.substring(0, charIndex++);
          el.textContent = currentText;
          if (charIndex > fullText.length) {
            isDeleting = true;
            setTimeout(type, 2000);
            return;
          }
          setTimeout(type, 80);
        }
      }
      type();
    })();

    // ── Password Toggle ──
    const togglePasswordBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');

    togglePasswordBtn.addEventListener('click', function() {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      if (type === 'text') {
        toggleIcon.className = 'fa-regular fa-eye-slash';
        this.setAttribute('aria-label', 'Hide password');
      } else {
        toggleIcon.className = 'fa-regular fa-eye';
        this.setAttribute('aria-label', 'Show password');
      }
    });

    // ── Login Logic ──
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorEl = document.getElementById('loginError');

      if (!username || !password) {
        errorEl.textContent = 'Please fill in all fields.';
        errorEl.classList.add('show');
        return;
      }

      // Show loading state on button
      const btn = document.querySelector('.btn-login');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fa-regular fa-spinner fa-spin"></i> Signing in...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/admin/dashboard.html';
        } else {
          errorEl.textContent = 'Invalid username or password.';
          errorEl.classList.add('show');
          errorEl.style.animation = 'none';
          requestAnimationFrame(() => {
            errorEl.style.animation = 'shake 0.4s ease';
          });
        }
      } catch {
        errorEl.textContent = 'Network error. Please try again.';
        errorEl.classList.add('show');
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    });

    // ── Clear error on input ──
    document.querySelectorAll('#loginForm input').forEach(input => {
      input.addEventListener('input', () => {
        document.getElementById('loginError').classList.remove('show');
      });
    });
  </script>

</body>
</html>
