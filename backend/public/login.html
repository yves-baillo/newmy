<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HYSSOP-Admin Login</title>

    <link rel="icon" href="logo.png" type="image/jpeg">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            min-height: 100vh;

            font-family: "Inter", Arial, sans-serif;

            background: #080a0f;

            color: #ffffff;

            overflow-x: hidden;
        }


        /* =========================================================
           PAGE
        ========================================================= */

        .page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }


        /* =========================================================
           MAIN CONTAINER
        ========================================================= */

        .login-container {

            width: 100%;

            max-width: 1050px;

            min-height: 600px;

            display: grid;

            grid-template-columns: 55% 45%;

            position: relative;

            overflow: hidden;

            background: #11131b;

            border: 1px solid
                rgba(215, 173, 69, 0.55);

            box-shadow:
                0 20px 70px
                rgba(0, 0, 0, 0.55);

            animation:
                pageIn 0.8s
                cubic-bezier(.22,1,.36,1);
        }


        @keyframes pageIn {

            from {
                opacity: 0;
                transform: scale(.97);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }


        /* =========================================================
           HERO
        ========================================================= */

        .hero {

            min-height: 600px;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            background:
                linear-gradient(
                    rgba(8, 10, 15, .46),
                    rgba(8, 10, 15, .68)
                ),
                linear-gradient(
                    135deg,
                    #d7ad45,
                    #17181f
                );
        }


        /*
        ==========================================================
        HERO BACKGROUND IMAGE

        Change this to your preferred image.

        Example:
        background-image: url("choir.jpg");
        ==========================================================
        */

        .hero::before {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    rgba(8, 10, 15, .45),
                    rgba(8, 10, 15, .70)
                ),
                url("3.jpeg");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            transform: scale(1.02);

            z-index: 0;
        }


        /* =========================================================
           HERO DARK OVERLAY
        ========================================================= */

        .hero::after {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    90deg,
                    rgba(8,10,15,.15),
                    rgba(8,10,15,.42)
                );

            z-index: 1;
        }


        /* =========================================================
           HERO CONTENT

           Similar typography/layout to screenshot
        ========================================================= */

        .hero-content {

            width: 100%;

            max-width: 560px;

            position: relative;

            z-index: 5;

            padding: 50px;

            display: flex;

            flex-direction: column;

            align-items: flex-start;

            justify-content: center;

            animation:
                heroTextIn 1s
                .15s
                both
                cubic-bezier(.22,1,.36,1);
        }


        @keyframes heroTextIn {

            from {
                opacity: 0;

                transform:
                    translateY(30px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =========================================================
           LOGO
        ========================================================= */

        .hero-logo {

            width: 82px;

            height: 82px;

            object-fit: cover;

            margin-bottom: 25px;

            border-radius: 50%;

            border: 2px solid
                rgba(255,255,255,.85);

            box-shadow:
                0 8px 30px
                rgba(0,0,0,.35);

            animation:
                logoFloat 4s ease-in-out infinite;
        }


        @keyframes logoFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }


        /* =========================================================
           SMALL GOLD LINE
        ========================================================= */

        .gold-line {

            width: 55px;

            height: 3px;

            margin-bottom: 22px;

            background: #d7ad45;

            border-radius: 10px;
        }


        /* =========================================================
           HERO TITLE
        ========================================================= */

        .hero h1 {

            color: #ffffff;

            font-family:
                "DM Serif Display",
                Georgia,
                "Times New Roman",
                serif;

            font-size: clamp(
                32px,
                4vw,
                53px
            );

            line-height: 1.04;

            font-weight: 400;

            letter-spacing: -.8px;

            margin-bottom: 20px;

            text-shadow:
                0 3px 12px
                rgba(0,0,0,.45);
        }


        /* =========================================================
           HERO DESCRIPTION
        ========================================================= */

        .hero-description {

            max-width: 540px;

            color:
                rgba(255,255,255,.91);

            font-family:
                "DM Serif Display",
                Georgia,
                "Times New Roman",
                serif;

            font-size: clamp(
                18px,
                2vw,
                25px
            );

            line-height: 1.28;

            letter-spacing: -.2px;

            text-shadow:
                0 2px 8px
                rgba(0,0,0,.5);
        }


        /* =========================================================
           LOGIN SIDE
        ========================================================= */

        .login-section {

            min-height: 600px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            padding:
                55px
                50px;

            background: #11131b;

            position: relative;

            z-index: 10;
        }


        /* =========================================================
           GOLD TOP LINE
        ========================================================= */

        .login-section::before {

            content: "";

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 3px;

            background:
                linear-gradient(
                    90deg,
                    #d7ad45,
                    #e8c25a,
                    transparent
                );
        }


        /* =========================================================
           LOGIN HEADER
        ========================================================= */

        .login-header {

            margin-bottom: 38px;
        }


        .login-header h2 {

            font-family:
                "DM Serif Display",
                Georgia,
                "Times New Roman",
                serif;

            color: #ffffff;

            font-size: 42px;

            line-height: 1;

            font-weight: 400;

            margin-bottom: 12px;
        }


        .login-header p {

            color: #8c8e98;

            font-size: 12px;

            line-height: 1.6;
        }


        /* =========================================================
           FORM
        ========================================================= */

        .form-group {

            margin-bottom: 25px;
        }


        .form-group label {

            display: block;

            margin-bottom: 9px;

            color: #c3c4ca;

            font-size: 10px;

            font-weight: 600;

            text-transform: uppercase;

            letter-spacing: 1px;
        }


        /* =========================================================
           INPUT
        ========================================================= */

        .input-wrapper {

            position: relative;

            border-bottom:
                1px solid #62646e;

            transition:
                border-color .3s ease;
        }


        .input-wrapper::after {

            content: "";

            position: absolute;

            left: 0;

            bottom: -1px;

            width: 0;

            height: 2px;

            background: #d7ad45;

            transition:
                width .35s ease;
        }


        .input-wrapper:focus-within {

            border-color: #d7ad45;
        }


        .input-wrapper:focus-within::after {

            width: 100%;
        }


        .input-wrapper input {

            width: 100%;

            height: 46px;

            border: none;

            outline: none;

            background: transparent;

            color: #ffffff;

            padding:
                8px
                40px
                8px
                4px;

            font-family:
                "Inter",
                Arial,
                sans-serif;

            font-size: 13px;
        }


        .input-wrapper input::placeholder {

            color: #5e6069;
        }


        /* =========================================================
           INPUT ICON
        ========================================================= */

        .input-icon {

            position: absolute;

            right: 5px;

            top: 50%;

            transform:
                translateY(-50%);

            color: #70727c;

            font-size: 13px;

            pointer-events: none;
        }


        /* =========================================================
           PASSWORD BUTTON
        ========================================================= */

        .password-toggle {

            position: absolute;

            right: 0;

            top: 50%;

            transform:
                translateY(-50%);

            width: 35px;

            height: 35px;

            display: flex;

            align-items: center;

            justify-content: center;

            border: none;

            background: transparent;

            color: #70727c;

            cursor: pointer;

            transition:
                color .3s ease;
        }


        .password-toggle:hover {

            color: #d7ad45;
        }


        /* =========================================================
           LOGIN BUTTON
        ========================================================= */

        .btn-login {

            width: 100%;

            height: 47px;

            margin-top: 7px;

            border: none;

            border-radius: 3px;

            background:
                linear-gradient(
                    135deg,
                    #d7ad45,
                    #e8c25a
                );

            color: #11131b;

            font-family:
                "Inter",
                Arial,
                sans-serif;

            font-size: 12px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 1px;

            cursor: pointer;

            box-shadow:
                0 7px 25px
                rgba(215,173,69,.16);

            transition:
                transform .3s ease,
                box-shadow .3s ease,
                filter .3s ease;
        }


        .btn-login:hover {

            transform:
                translateY(-2px);

            filter: brightness(1.08);

            box-shadow:
                0 12px 35px
                rgba(215,173,69,.27);
        }


        .btn-login:active {

            transform:
                translateY(0);
        }


        .btn-login:disabled {

            opacity: .55;

            cursor: not-allowed;

            transform: none;
        }


        .btn-login i {

            margin-right: 7px;
        }


        /* =========================================================
           ERROR
        ========================================================= */

        .error-message {

            display: none;

            margin-top: 15px;

            padding: 10px 12px;

            border:
                1px solid
                rgba(231,76,60,.2);

            background:
                rgba(231,76,60,.07);

            color: #e86b60;

            font-size: 11px;

            text-align: center;

            border-radius: 3px;
        }


        .error-message.show {

            display: block;

            animation:
                shake .4s ease;
        }


        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-6px);
            }

            40% {
                transform: translateX(6px);
            }

            60% {
                transform: translateX(-4px);
            }

            80% {
                transform: translateX(4px);
            }
        }


        /* =========================================================
           BACK LINK
        ========================================================= */

        .back-link {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 7px;

            margin-top: 25px;

            color: #777984;

            text-decoration: none;

            font-size: 11px;

            transition:
                color .3s ease;
        }


        .back-link:hover {

            color: #d7ad45;
        }


        /* =========================================================
           TABLET
        ========================================================= */

        @media (max-width: 850px) {

            .page {

                padding: 20px;
            }


            .login-container {

                grid-template-columns:
                    52% 48%;

                min-height: 550px;
            }


            .hero {

                min-height: 550px;
            }


            .login-section {

                min-height: 550px;

                padding:
                    45px 35px;
            }


            .hero-content {

                padding:
                    35px;
            }


            .hero h1 {

                font-size: 35px;
            }


            .hero-description {

                font-size: 18px;
            }


            .login-header h2 {

                font-size: 35px;
            }
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 700px) {

            body {

                background: #080a0f;
            }


            .page {

                min-height: 100vh;

                padding: 15px;
            }


            .login-container {

                width: 100%;

                max-width: 450px;

                display: flex;

                flex-direction: column;

                min-height: auto;
            }


            /* -----------------------------------------------------
               HERO
            ----------------------------------------------------- */

            .hero {

                width: 100%;

                min-height: 390px;

                order: 1;
            }


            .hero-content {

                max-width: 100%;

                padding:
                    35px 28px;

                align-items: center;

                text-align: center;

                justify-content: center;
            }


            .hero-logo {

                width: 70px;

                height: 70px;

                margin-bottom: 20px;
            }


            .gold-line {

                width: 45px;

                height: 2px;

                margin-bottom: 17px;
            }


            .hero h1 {

                font-size: 34px;

                line-height: 1.05;

                margin-bottom: 17px;
            }


            .hero-description {

                max-width: 340px;

                font-size: 19px;

                line-height: 1.3;
            }


            /* -----------------------------------------------------
               LOGIN
            ----------------------------------------------------- */

            .login-section {

                width: 100%;

                min-height: auto;

                order: 2;

                padding:
                    40px 30px 35px;
            }


            .login-header {

                margin-bottom: 30px;

                text-align: center;
            }


            .login-header h2 {

                font-size: 35px;
            }


            .login-header p {

                font-size: 11px;
            }


            .form-group {

                margin-bottom: 22px;
            }


            .btn-login {

                height: 46px;
            }
        }


        /* =========================================================
           SMALL PHONES
        ========================================================= */

        @media (max-width: 380px) {

            .page {

                padding: 10px;
            }


            .hero {

                min-height: 350px;
            }


            .hero-content {

                padding:
                    30px 20px;
            }


            .hero-logo {

                width: 62px;

                height: 62px;

                margin-bottom: 16px;
            }


            .hero h1 {

                font-size: 29px;
            }


            .hero-description {

                font-size: 17px;
            }


            .login-section {

                padding:
                    35px 23px 30px;
            }


            .login-header h2 {

                font-size: 31px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================================================
         PAGE
    ========================================================= -->

    <main class="page">


        <!-- =====================================================
             LOGIN CONTAINER
        ===================================================== -->

        <div class="login-container">


            <!-- =================================================
                 HERO
            ================================================= -->

            <section class="hero">


                <div class="hero-content">


                    <!-- LOGO -->

                    <img
                        src="3.jpeg"
                        alt="HYSSOP"
                        class="hero-logo"
                    >


                    <!-- GOLD LINE -->

                    <div class="gold-line"></div>


                    <!-- TITLE -->

                    <h1>
                        Welcome to HYSSOP
                    </h1>


                    <!-- DESCRIPTION -->

                    <p class="hero-description">
                        Serve God through music,
                        grow together in faith,
                        and help lead others
                        into worship.
                    </p>


                </div>


            </section>



            <!-- =================================================
                 LOGIN
            ================================================= -->

            <section class="login-section">


                <!-- LOGIN HEADER -->

                <div class="login-header">

                    <h2>
                        Login
                    </h2>

                    <p>
                        Sign in to access the
                        administration dashboard.
                    </p>

                </div>



                <!-- LOGIN FORM -->

                <form id="loginForm">


                    <!-- USERNAME -->

                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Enter your username"
                                autocomplete="username"
                                required
                                autofocus
                            >

                            <i
                                class="fa-solid fa-user input-icon">
                            </i>

                        </div>

                    </div>



                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="input-wrapper">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="togglePassword"
                                aria-label="Show password"
                            >

                                <i
                                    class="fa-regular fa-eye"
                                    id="toggleIcon">
                                </i>

                            </button>

                        </div>

                    </div>



                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="btn-login"
                    >

                        <i
                            class="fa-solid fa-right-to-bracket">
                        </i>

                        Sign In

                    </button>



                    <!-- ERROR -->

                    <div
                        class="error-message"
                        id="loginError"
                    >
                        Invalid username or password.
                    </div>


                </form>



                <!-- BACK TO WEBSITE -->

                <a
                    href="/"
                    class="back-link"
                >

                    <i
                        class="fa-solid fa-arrow-left">
                    </i>

                    Back to Website

                </a>


            </section>


        </div>

    </main>



    <script>

        /* =========================================================
           PASSWORD SHOW / HIDE
        ========================================================= */

        const togglePassword =
            document.getElementById(
                "togglePassword"
            );

        const passwordInput =
            document.getElementById(
                "password"
            );

        const toggleIcon =
            document.getElementById(
                "toggleIcon"
            );


        togglePassword.addEventListener(
            "click",
            function () {

                if (
                    passwordInput.type ===
                    "password"
                ) {

                    passwordInput.type =
                        "text";

                    toggleIcon.className =
                        "fa-regular fa-eye-slash";

                    this.setAttribute(
                        "aria-label",
                        "Hide password"
                    );

                } else {

                    passwordInput.type =
                        "password";

                    toggleIcon.className =
                        "fa-regular fa-eye";

                    this.setAttribute(
                        "aria-label",
                        "Show password"
                    );
                }

            }
        );



        /* =========================================================
           LOGIN FORM
        ========================================================= */

        const loginForm =
            document.getElementById(
                "loginForm"
            );


        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const username =
                    document
                        .getElementById(
                            "username"
                        )
                        .value
                        .trim();


                const password =
                    document
                        .getElementById(
                            "password"
                        )
                        .value
                        .trim();


                const errorMessage =
                    document.getElementById(
                        "loginError"
                    );


                /* ---------------------------------------------
                   VALIDATION
                --------------------------------------------- */

                if (
                    !username ||
                    !password
                ) {

                    errorMessage.textContent =
                        "Please fill in all fields.";

                    errorMessage.classList.add(
                        "show"
                    );

                    return;
                }


                /* ---------------------------------------------
                   BUTTON LOADING
                --------------------------------------------- */

                const loginButton =
                    document.querySelector(
                        ".btn-login"
                    );


                const originalButton =
                    loginButton.innerHTML;


                loginButton.disabled = true;


                loginButton.innerHTML =
                    `
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    Signing in...
                    `;


                errorMessage.classList.remove(
                    "show"
                );


                /* ---------------------------------------------
                   API REQUEST
                --------------------------------------------- */

                try {

                    const response =
                        await fetch(
                            "/api/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        username:
                                            username,

                                        password:
                                            password
                                    })
                            }
                        );


                    const data =
                        await response.json();


                    /* -----------------------------------------
                       LOGIN SUCCESS
                    ----------------------------------------- */

                    if (data.success) {

                        window.location.href =
                            "/admin/dashboard.html";

                        return;
                    }


                    /* -----------------------------------------
                       LOGIN FAILED
                    ----------------------------------------- */

                    errorMessage.textContent =
                        "Invalid username or password.";

                    errorMessage.classList.add(
                        "show"
                    );

                }


                /* ---------------------------------------------
                   NETWORK ERROR
                --------------------------------------------- */

                catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    errorMessage.textContent =
                        "Unable to connect to the server. Please try again.";

                    errorMessage.classList.add(
                        "show"
                    );

                }


                /* ---------------------------------------------
                   RESET BUTTON
                --------------------------------------------- */

                finally {

                    loginButton.disabled =
                        false;

                    loginButton.innerHTML =
                        originalButton;
                }

            }
        );



        /* =========================================================
           REMOVE ERROR WHEN TYPING
        ========================================================= */

        document
            .querySelectorAll(
                "#loginForm input"
            )
            .forEach(
                function (input) {

                    input.addEventListener(
                        "input",
                        function () {

                            document
                                .getElementById(
                                    "loginError"
                                )
                                .classList.remove(
                                    "show"
                                );

                        }
                    );

                }
            );

    </script>

</body>

</html>
